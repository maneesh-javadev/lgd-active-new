# ==============================================================================
# LGD 2.0 - Production Compose Hardening Override (docker-compose.prod.yml)
#
# Production hardening override file:
# - Enforces SPRING_PROFILES_ACTIVE=prod across all services
# - Enforces restart: always
# - Defines strict resource limits (CPU / Memory)
# - Enforces container hardening: no-new-privileges, cap_drop: ALL
# - Terminates TLS 1.3 / 1.2 on Nginx ingress (ports 80/443)
# - Unmaps public port 8092 from API Gateway (internal mesh only)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  service-discovery:
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  auth-service:
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  user-management:
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  revenue:
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M

  api-gateway:
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # In production, port 8092 is NOT published to host; traffic routes via Nginx ingress
    ports: []
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  redis:
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  nginx-ingress:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: lgd-ingress
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
    security_opt:
      - no-new-privileges:true
    networks:
      - lgd-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
