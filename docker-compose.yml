# ==============================================================================
# LGD 2.0 - Authoritative Production Docker Compose Specification
# Architecture: Spring Boot Microservices + Netflix Eureka + Spring Cloud Gateway
# Security Standard: ISO/IEC 27001, OWASP ASVS 4.0, NIST SP 800-53
#
# NETWORK TOPOLOGY & PORT EXPOSURE POLICY:
# 1. Production Mode: Only the API Gateway publishes an external port (8092).
#    All internal microservices communicate strictly over the internal Docker
#    bridge network ('lgd-network') without published host ports.
# 2. For local debugging/development requiring direct host access to internal
#    services, use the development override file: 'docker-compose.dev.yml'.
# 3. Database (PostgreSQL) and Cache (Redis) are hosted on the container host
#    accessible via 'host.docker.internal' (host-gateway). Note that host.docker.internal
#    routes to the host OS interface and is NOT isolated within the Docker bridge.
#    Host OS firewall rules and database TLS must enforce external segmentation.
# ==============================================================================

services:
  service-discovery:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    container_name: service-discovery
    # In production, internal discovery port 8761 is NOT published to host interfaces.
    # Access is restricted exclusively to internal containers on 'lgd-network'.
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      SERVER_PORT: 8761
      SPRING_APPLICATION_NAME: service-discovery
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Eureka HTTP Basic Authentication (SAST-020) - Aligned with client credentials
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - lgd-network
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    # Port 18090 removed from production publish; routed via api-gateway on lgd-network.
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      SERVER_PORT: 18090
      SPRING_APPLICATION_NAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/lgd
      # Mandatory credentials without hardcoded fallbacks
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176"
      REVENUE_SERVICE_URL: http://revenue:18062/public/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lgd-network
    restart: unless-stopped

  user-management:
    build:
      context: ./user-management
      dockerfile: Dockerfile
    container_name: user-management
    # Port 18089 removed from production publish; routed via api-gateway on lgd-network.
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      SERVER_PORT: 18089
      SPRING_APPLICATION_NAME: user-management
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/lgd
      # Mandatory credentials without hardcoded fallbacks
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JWT_SECRET: ${JWT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lgd-network
    restart: unless-stopped

  revenue:
    build:
      context: ./revenue
      dockerfile: Dockerfile
    container_name: revenue
    # Port 18062 removed from production publish; routed via api-gateway on lgd-network.
    depends_on:
      service-discovery:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      SERVER_PORT: 18062
      SPRING_APPLICATION_NAME: revenue
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/lgd
      # Mandatory credentials without hardcoded fallbacks
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      USER_SERVICE_URL: http://auth-service:18090
      JWT_SECRET: ${JWT_SECRET}
      # Mandatory eSign PKCS#12 Keystore Password without fallback (SAST-003)
      ESIGN_KEYSTORE_PASSWORD: ${ESIGN_KEYSTORE_PASSWORD}
      ESIGN_OUTPUT_FILE_PATH: "/tmp/uploadFile"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lgd-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    # In production, ONLY API Gateway publishes an ingress port.
    ports:
      - "8092:8092"
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      SERVER_PORT: 8092
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/lgd
      # Mandatory credentials without hardcoded fallbacks
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      USER_MANAGEMENT_SERVICE_URL: http://user-management:18089
      JWT_SECRET: ${JWT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lgd-network
    restart: unless-stopped

networks:
  lgd-network:
    name: lgd-network
    driver: bridge
